# Development overlay: mount source code, expose Vite, skip production caches.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  app:
    build:
      target: development
    user: root
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      RUN_MIGRATIONS: "true"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules

  nginx:
    image: nginx:1.27-alpine
    build: !reset null
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public
      - storage:/var/www/html/storage:ro
    ports:
      - "${APP_PORT:-8080}:80"

  queue:
    user: root
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor

  vite:
    image: node:20-alpine
    container_name: card-nexus-vite
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      VITE_APP_NAME: "Card Nexus"
    networks:
      - card-nexus
